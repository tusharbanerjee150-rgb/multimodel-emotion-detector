<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- 7 Emotion Botanical Gradients -->
    <!-- 1. Happy (Vibrant Emerald / Sage) -->
    <linearGradient id="gradHappy" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="60%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#74C69D" />
    </linearGradient>

    <!-- 2. Surprise (Radiant Peach / Amber Gold) -->
    <linearGradient id="gradSurprise" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B07D4F" />
      <stop offset="60%" stop-color="#DDA15E" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>

    <!-- 3. Neutral (Balanced Sage / Silver Slate) -->
    <linearGradient id="gradNeutral" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#354F52" />
      <stop offset="60%" stop-color="#84A98C" />
      <stop offset="100%" stop-color="#A3C9A8" />
    </linearGradient>

    <!-- 4. Sad (Deep Oceanic / Steel Blue) -->
    <linearGradient id="gradSad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D3557" />
      <stop offset="60%" stop-color="#457B9D" />
      <stop offset="100%" stop-color="#64B5F6" />
    </linearGradient>

    <!-- 5. Angry (Fiery Terracotta / Crimson) -->
    <linearGradient id="gradAngry" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9E2A2B" />
      <stop offset="60%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#FF758F" />
    </linearGradient>

    <!-- 6. Fear (Amethyst / Mystic Purple) -->
    <linearGradient id="gradFear" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5A189A" />
      <stop offset="60%" stop-color="#9B5DE5" />
      <stop offset="100%" stop-color="#C77DFF" />
    </linearGradient>

    <!-- 7. Disgust (Dark Forest / Olive Earth) -->
    <linearGradient id="gradDisgust" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E3F20" />
      <stop offset="60%" stop-color="#3A5A40" />
      <stop offset="100%" stop-color="#6B8E23" />
    </linearGradient>

    <!-- Center Core Gradient -->
    <radialGradient id="centerCoreDisk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18231E" />
      <stop offset="85%" stop-color="#0E1613" />
      <stop offset="100%" stop-color="#070C0A" />
    </radialGradient>

    <!-- Soft Depth Shadow -->
    <filter id="petalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient Outer Symmetry & Orbital Guide Rings -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="#52796F" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.45" />
  <circle cx="80" cy="80" r="66" fill="none" stroke="#84A98C" stroke-width="0.8" opacity="0.35" />

  <!-- 7 EXACT PETALS FOR 7 EMOTIONS (Angle Step = 360 / 7 ≈ 51.4286 deg) -->
  <g filter="url(#petalGlow)">
    <!-- Petal 1: HAPPY (0°) - Vibrant Emerald/Sage Green -->
    <g transform="rotate(0 80 80)">
      <path d="M80 80 C69 46, 67 20, 80 6 C93 20, 91 46, 80 80 Z" fill="url(#gradHappy)" />
      <circle cx="80" cy="9" r="2.5" fill="#74C69D" />
    </g>

    <!-- Petal 2: SURPRISE (51.43°) - Radiant Amber / Gold -->
    <g transform="rotate(51.4286 80 80)">
      <path d="M80 80 C69 46, 67 20, 80 6 C93 20, 91 46, 80 80 Z" fill="url(#gradSurprise)" />
      <circle cx="80" cy="9" r="2.5" fill="#F4A261" />
    </g>

    <!-- Petal 3: NEUTRAL (102.86°) - Sage Slate Green -->
    <g transform="rotate(102.8571 80 80)">
      <path d="M80 80 C69 46, 67 20, 80 6 C93 20, 91 46, 80 80 Z" fill="url(#gradNeutral)" />
      <circle cx="80" cy="9" r="2.5" fill="#A3C9A8" />
    </g>

    <!-- Petal 4: SAD (154.29°) - Deep Oceanic Blue -->
    <g transform="rotate(154.2857 80 80)">
      <path d="M80 80 C69 46, 67 20, 80 6 C93 20, 91 46, 80 80 Z" fill="url(#gradSad)" />
      <circle cx="80" cy="9" r="2.5" fill="#64B5F6" />
    </g>

    <!-- Petal 5: ANGRY (205.71°) - Terracotta / Crimson Red -->
    <g transform="rotate(205.7143 80 80)">
      <path d="M80 80 C69 46, 67 20, 80 6 C93 20, 91 46, 80 80 Z" fill="url(#gradAngry)" />
      <circle cx="80" cy="9" r="2.5" fill="#FF758F" />
    </g>

    <!-- Petal 6: FEAR (257.14°) - Amethyst Purple -->
    <g transform="rotate(257.1429 80 80)">
      <path d="M80 80 C69 46, 67 20, 80 6 C93 20, 91 46, 80 80 Z" fill="url(#gradFear)" />
      <circle cx="80" cy="9" r="2.5" fill="#C77DFF" />
    </g>

    <!-- Petal 7: DISGUST (308.57°) - Dark Forest / Olive Green -->
    <g transform="rotate(308.5714 80 80)">
      <path d="M80 80 C69 46, 67 20, 80 6 C93 20, 91 46, 80 80 Z" fill="url(#gradDisgust)" />
      <circle cx="80" cy="9" r="2.5" fill="#6B8E23" />
    </g>
  </g>

  <!-- Inner Concentric Geometry Accent Ring -->
  <circle cx="80" cy="80" r="32" fill="none" stroke="#A3C9A8" stroke-width="1.4" stroke-dasharray="2 3" opacity="0.65" />

  <!-- Center Core Flower Disk -->
  <circle cx="80" cy="80" r="27" fill="url(#centerCoreDisk)" stroke="#84A98C" stroke-width="2.2" />

  <!-- Central "EmotionX" Text Engraving in Flower Center -->
  <text x="80" y="83.5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    Emotion<tspan fill="#E07A5F">X</tspan>
  </text>
</svg>
